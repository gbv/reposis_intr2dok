# Project specific configuration for intr2dok.
# Only properties that differ from MyCoRe, MIR or reposis_common defaults are listed here.
# Empty values differ between test and production or are confidential and must be set via Ansible inventory.

##############################################################################
# Basic                                                                      #
##############################################################################
# Base URL, e.g. https://domain without trailing '/'
MCR.baseurl=

# Base URL for canonical links on metadata pages, e.g. https://domain/
MIR.CanonicalBaseURL=

MCR.NameOfProject=IntR2Dok

##############################################################################
# Email                                                                      #
##############################################################################
MCR.Mail.Server=

# General sender mail address, e.g. mail@domain
MCR.Mail.Sender=

# Editor mail addresses for messages, e.g. mail@domain0,mail@domain1
MCR.Mail.Address=

# Sender mail for events, e.g. <name> mail@domain
MCR.mir-module.MailSender=

# Mail for events including self registration, e.g. <name> mail@domain
MCR.mir-module.EditorMail=

##############################################################################
# Access Control                                                             #
##############################################################################
# Disable access keys, MIR enables them for mods
MCR.ACL.AccessKey.Strategy.AllowedObjectTypes=

# Evaluate mir_access before state, MIR uses state,mir_access
MIR.Access.Strategy.Classifications=mir_access,state

# Handle imported state like submitted state
MCR.Access.Strategy.SubmittedCategory=state:submitted,state:imported

# Add custom roles and ignore restapi
MCR.Rest.JWT.Roles=admin,editor,submitter,reader,blog_editor_verfassungsblog,blog_editor_voelkerrechtsblog,\
  blog_editor_juwissblog

# Allow to fetch the entire object list via REST API, like it used to be possible before 2023.06.x
MCR.RestAPI.V2.ListObjects.PageSize.Max=999999

##############################################################################
# Frontend                                                                   #
##############################################################################
# German only user interface, hides the language menu and ignores other browser languages, MIR uses de,en
MCR.Metadata.Languages=de

MIR.CustomLayout.JS=intrechtdok.js

# Maximum number of publications that can be outputted within toc
MIR.TableOfContents.MaxResults=10000

# ePuSta is disabled until the endpoint is configured
#MIR.ePuSta=show
MIR.ePuSta.providerURL=

# Matomo tracking is disabled by default (0), production must set the site id 22 via inventory
#piwikID=22

# Show altmetrics donut even if no statistics are available, MIR hides it
MIR.altmetrics.hide=false

# Show PlumX badge in metadata view, MIR hides it
MIR.plumx=show
# Show PlumX badge even if no statistics are available, MIR hides it
MIR.plumx.hide=false

# Legal citation styles, see https://www.zotero.org/styles, MIR.citationStyles uses them as well
# Does not work at the moment: bluebook-law-review
MCR.Export.CSL.Styles=archiv-fur-die-civilistische-praxis,austrian-legal,chicago-author-date,chicago-author-date-de,\
  computer-und-recht,der-moderne-staat,elsevier-harvard,gewerblicher-rechtsschutz-und-urheberrecht,\
  juristische-schulung,juristische-zitierweise,kommunikation-und-recht,law-and-society-review,\
  leidraad-voor-juridische-auteurs,mohr-siebeck-recht,neue-juristische-wochenschrift,oxford-university-press-humsoc,\
  polish-legal,spanish-legal,swedish-legal,the-journal-of-juristic-papyrology,vienna-legal

##############################################################################
# Editor                                                                     #
##############################################################################
MIR.EditorForms.CustomIncludes=%MIR.EditorForms.CustomIncludes%,\
  xslStyle:editor/mir2xeditor:webapp:editor/editor-customization.xed

##############################################################################
# OAI                                                                        #
##############################################################################
MCR.OAIDataProvider.OAI2.RepositoryName=Fachinformationsdienst f\u00FCr internationale und interdisziplin\u00E4re Rechtsforschung
MCR.OAIDataProvider.OAI2.AdminEmail=

# Existing object used as sample identifier in OAI Identify
MCR.OAIDataProvider.OAI2.RecordSampleID=mir_mods_00000003

# Keep format, changing it changes all OAI identifiers
MCR.OAIDataProvider.OAI2.RepositoryIdentifier=

MCR.OAIDataProvider.OAI2.DescriptionURI.EPrints=webapp:oai/oai-eprints.xml
MCR.OAIDataProvider.OAI2.DescriptionURI.Rights=webapp:oai/oai-rights.xml

# Do not keep deleted records permanently, MIR uses persistent
MCR.OAIDataProvider.OAI2.DeletedRecord=transient

# Publisher in xMetaDissPlus
MCR.OAIDataProvider.RepositoryPublisherName=Fachinformationsdienst f\u00FCr internationale und interdisziplin\u00E4re Rechtsforschung \r\nStaatsbibliothek zu Berlin - Preu\u00DFischer Kulturbesitz
MCR.OAIDataProvider.RepositoryPublisherPlace=Berlin
MCR.OAIDataProvider.RepositoryPublisherAddress=Potsdamer Stra\u00DFe 33

# Offer oai_datacite instead of marcxml
MCR.OAIDataProvider.OAI2.MetadataFormats=oai_dc,mods,epicur,oai_datacite,xMetaDissPlus
MCR.OAIDataProvider.MetadataFormat.oai_datacite.Namespace=http://schema.datacite.org/oai/oai-1.0/
MCR.OAIDataProvider.MetadataFormat.oai_datacite.Schema=http://schema.datacite.org/oai/oai-1.0/oai_datacite.xsd

# Replace institute set with xmetadissplus set and urn set from reposis_common
MCR.OAIDataProvider.OAI2.Sets=doc-type,open_access,openaire,driver,ec_fundedresources,GENRE,ddc,xmetadissplus,urn
MCR.OAIDataProvider.OAI2.Sets.urn.Query=mods.identifier:urn* AND mods.identifier:*0301-*

# Build ddc set from full DDC classification, MIR uses SDNB
MCR.OAIDataProvider.OAI2.Sets.ddc.URI=xslStyle:classification2sets:classification:metadata:10:children:DDC
MCR.OAIDataProvider.OAI2.Sets.ddc.Classification=DDC

# Published objects with files for DNB delivery
MCR.OAIDataProvider.OAI2.MapSetToQuery.xmetadissplus=derCount:[1 TO *] AND NOT(mods.type:video OR mods.type:research_data OR mods.type:journal OR mods.type:series) AND state:published AND objectType:mods
MCR.OAIDataProvider.OAI2.Sets.xmetadissplus.URI=webapp:oai/set_xmetadissplus.xml

# Friendly repositories in OAI Identify
MCR.OAIDataProvider.OAI2.Friends.OpenAgrar=https://openagrar.bmel-forschung.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.DuEPublico=https://duepublico.uni-duisburg-essen.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.DBThueringen=https://www.db-thueringen.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.RosDok=https://rosdok.uni-rostock.de/oai

##############################################################################
# DOI                                                                        #
##############################################################################
MCR.DOI.Prefix=10.17176
MCR.DOI.HostingInstitution=Fachinformationsdienst f\u00FCr internationale und interdisziplin\u00E4re Rechtsforschung

# Service is disabled until Datacite credentials are configured
#MCR.PI.Service.Datacite=org.mycore.pi.doi.MCRDOIService
MCR.PI.Service.Datacite.Transformer=datacite
MCR.PI.Service.Datacite.RegisterBaseURL=%MCR.baseurl%
MCR.PI.Service.Datacite.Username=
MCR.PI.Service.Datacite.Password=
MCR.PI.Service.Datacite.MetadataService=MODSDOI
MCR.PI.Service.Datacite.Generator=DateDOI

# DOIs are generated from the creation date of the object
MCR.PI.Generator.DateDOI=org.mycore.pi.doi.MCRCreateDateDOIGenerator

# Transfer registered DOIs to the blogs, publishers (VZG.VZGDOIPublisher.*) are set via inventory
MCR.EventHandler.MCRObject.016a.Class=de.vzg.intr2dok.doi.VZGPublishDOIEventHandler
MCR.CLI.Classes.External=%MCR.CLI.Classes.External%,de.vzg.intr2dok.doi.VZGDOIPublisherCommands

##############################################################################
# URN                                                                        #
##############################################################################
# URNs like urn:nbn:de:0301-20240101-120000-1-<checksum>
MCR.PI.Generator.TypeYearCountURN.Namespace=urn:nbn:de:0301-
MCR.PI.Generator.TypeYearCountURN.GeneralPattern=%MCR.PI.Generator.TypeYearCountURN.Namespace%$ObjectDate-$Count-
MCR.PI.Generator.TypeYearCountURN.DateFormat=yyyyMMdd-HHmmss
MCR.PI.Generator.TypeYearCountURN.CountPrecision=1

##############################################################################
# Import                                                                     #
##############################################################################
# Mail for Unpaywall requests
MIR.OADOI.Mail.Address=

# Enable DeepGreen import, MIR only provides the configuration commented out
MCR.Sword.Collection.IntR2Dok.DeepGreen=org.mycore.mir.sword2.MIRDeepGreenCollectionProvider
MCR.Sword.DeepGreen.Transformer=deepgreenjats2mods
MCR.Sword.DeepGreen.State=imported
MCR.ContentTransformer.deepgreenjats2mods.Class=org.mycore.common.content.transformer.MCRXSLTransformer
MCR.ContentTransformer.deepgreenjats2mods.Stylesheet=xslt/sword/jats2mods.xsl
MCR.ContentTransformer.deepgreenjats2mods.HostRelation=link
